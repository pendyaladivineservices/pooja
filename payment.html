<!-- OPTION 1 : UPI PAYMENT -->
<!-- ================================================= -->

<div class="phonepe-section">

    <h3>Pay Online with UPI</h3>

    <p>
        Select your preferred UPI app to complete the payment.
    </p>

    <button
        type="button"
        class="phonepe-btn"
        onclick="payWithPhonePe()">
        Pay with PhonePe
    </button>

    <button
        type="button"
        class="gpay-btn"
        onclick="payWithGPay()">
        Pay with Google Pay
    </button>

    <button
        type="button"
        class="other-upi-btn"
        onclick="payWithOtherUPI()">
        Other UPI Apps
    </button>

    <p class="phonepe-note">
        Amount will be automatically filled in your UPI app.
    </p>

</div>
